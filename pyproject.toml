[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keycat"
version = "2.7.0"
description = "Anti-gato para el teclado en Windows, estilo PawSense: bloquea el teclado al detectar comportamiento felino."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Leonardo Aguayo Lemus" }]
keywords = ["cat", "keyboard", "pawsense", "windows", "gato", "teclado"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Environment :: Win32 (MS Windows)",
]
dependencies = ["pystray", "Pillow", "pywin32"]

[project.urls]
Homepage = "https://github.com/leostriker111/KeyCat"
Issues = "https://github.com/leostriker111/KeyCat/issues"

[project.gui-scripts]
keycat = "keycat:main"

[tool.setuptools]
py-modules = ["keycat", "deteccion", "winutils"]
